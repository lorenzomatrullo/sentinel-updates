name: Discord Changelog

# Posts a clean, custom commit embed to a Discord channel on every push.
# Setup:
#   1. In Discord: Channel Settings -> Integrations -> Webhooks -> New Webhook,
#      copy the URL.
#   2. In GitHub: Repo Settings -> Secrets and variables -> Actions ->
#      New repository secret, name it DISCORD_WEBHOOK, paste the URL.
#   3. Place this file at .github/workflows/discord-changelog.yml in your repo.

on:
  push:
    branches:
      - main # add more branches here if you want them announced too

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit embed to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AUTHOR: ${{ github.event.head_commit.author.username || github.event.head_commit.author.name }}
          AUTHOR_URL: ${{ github.event.sender.html_url }}
          AVATAR: ${{ github.event.sender.avatar_url }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.event.repository.full_name }}
          REPO_URL: ${{ github.event.repository.html_url }}
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          SHA: ${{ github.sha }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set – skipping."
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"

          payload="$(jq -n \
            --arg author      "$AUTHOR" \
            --arg author_url  "$AUTHOR_URL" \
            --arg avatar      "$AVATAR" \
            --arg repo_name   "$REPO_NAME" \
            --arg repo_full   "$REPO_FULL" \
            --arg repo_url    "$REPO_URL" \
            --arg branch      "$BRANCH" \
            --arg message     "$MESSAGE" \
            --arg commit_url  "$COMMIT_URL" \
            --arg short_sha   "$SHORT_SHA" \
            --arg timestamp   "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: ("New Commit (push) ‒ " + $repo_name),
                  url: $commit_url,
                  color: 5213685,
                  author: {
                    name: $author,
                    url: $author_url,
                    icon_url: $avatar
                  },
                  description: (
                    "**Developer:** `" + $author + "`\n" +
                    "**Repository:** `" + $repo_full + "`\n\n" +
                    "**Commit Info:**\n```\n" + $message + "\n```\n" +
                    "`" + $short_sha + "` ‒ [View changes](" + $commit_url + ")"
                  ),
                  footer: {
                    text: ($branch + " ‒ " + $author),
                    icon_url: $avatar
                  },
                  timestamp: $timestamp
                }
              ]
            }')"

          curl -sf -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"
